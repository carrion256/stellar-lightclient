[package]
name = "stellar-light-client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = "1"
near-sdk = "5.29"
stellar-xdr = "28"
verifier = { path = "../verifier" }
verify-core = { path = "../verify-core" }

[dev-dependencies]
anyhow = "1"
base64 = "0.22"
# `unit-testing` + `non-contract-usage`: native tests run env::ed25519_verify through
# real ed25519-dalek instead of the mock shim. The wasm build keeps the host function.
near-sdk = { version = "5.29", features = ["unit-testing", "non-contract-usage"] }
# On-chain e2e: deploys the real wasm to a local neard sandbox (real alt_bn128 host
# functions, real gas metering) — see tests/sandbox.rs.
near-workspaces = "0.23"
# near-workspaces -> near-jsonrpc-client defaults to native-tls, which needs OpenSSL
# headers. Vendored builds it from source so this works on NixOS without system
# OpenSSL paths. If you have system OpenSSL, drop this and set OPENSSL_DIR instead.
openssl-sys = { version = "0.9", features = ["vendored"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = []
