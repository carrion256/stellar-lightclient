[package]
name = "xtask"
version = "0.1.0"
edition = "2021"

[dependencies]
stellar-xdr = { version = "28", features = ["base64"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
flate2 = "1"
sha2 = "0.10"
guest = { path = "../../guest/methods/guest" }
verify-core = { path = "../../verify-core" }
ureq = "2"
