# Workspace root for the RISC Zero side.
#
# `methods` is the canonical risc0 "methods" crate: its build.rs compiles the
# `guest` program and embeds the ELF + image id as Rust constants. risc0-build
# resolves each guest as `<methods crate>/<guest name>/Cargo.toml`, which is why
# the guest lives at `methods/guest/`.
#
# `methods/guest` is its own workspace (it has a `[workspace]` table and its own
# lockfile) because `cargo risczero build` compiles it standalone with
# `--manifest-path ... --locked`. A nested workspace must be excluded here.
[workspace]
members = ["methods"]
exclude = ["methods/guest"]
