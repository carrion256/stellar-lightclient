[package]
name = "guest"
version = "0.1.0"
edition = "2021"

# RISC Zero guest program. Natively `cargo test`-able: the zkVM entrypoint is
# behind the OFF-by-default `zkvm-entrypoint` feature, so plain builds and tests
# on this box (no rzup/cargo-risczero) never resolve `risc0-zkvm`.

[dependencies]
verify-core = { path = "../../../verify-core" }
# Precompile-accelerated forks from RISC Zero. In the zkVM these route SHA-256
# and the ed25519/curve25519 arithmetic through extension circuits instead of
# generic rv32im code, which is the whole cost model here: `verify_span`'s
# dominant term is `threshold` ed25519 verifications, and in the guest those are
# cycles rather than host calls. Natively the same crates fall back to the
# ordinary implementations, so `cargo test` still exercises the real algorithms.
#
# Tags from the RISC Zero precompile table (dev.risczero.com/api/zkvm/precompiles);
# neither requires an unstable flag. Kept in step with the `risc0-zkvm` 3.0.x pin
# below — a guest built with a different toolchain produces a different
# `bn254_control_id` and the contract's wrapper pinning rejects the receipt.
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
ed25519-dalek = { git = "https://github.com/risc0/curve25519-dalek", tag = "curve25519-4.1.3-risczero.0", features = ["batch"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"

# Pinned to the 3.0.x line the NEAR contract's Groth16 verifying key was
# transcribed from: a guest proven with the 5.x toolchain produces a different
# bn254_control_id and the contract's wrapper pinning rejects the receipt.
# Guest and verifier MUST be the same RISC Zero release.
risc0-zkvm = { version = "~3.0.5", optional = true }

[dev-dependencies]
serde_json = "1"
base64 = "0.22"
# For `tests/epoch.rs`'s `zkvm_cycle_breakdown`: execute the built ELF in the
# zkVM and report the cycle breakdown. Execution only — no proving.
risc0-zkvm = { version = "~3.0.5", features = ["std"] }
risc0-binfmt = "~3.0.5"
# The V1COMPAT kernel the user ELF must be packaged with before execution.
# Versioned independently of `risc0-zkvm`; 2.2.3 is what the zkvm 3.x line pulls.
risc0-zkos-v1compat = "2.2.3"
# Threshold computation in tests decodes real SCP envelopes, exactly like
# `contract/src/tests.rs::trust_set_and_externalizers` does.
stellar-xdr = "28"

[features]
default = []
zkvm-entrypoint = ["dep:risc0-zkvm"]

[[bin]]
name = "guest-stub"
path = "src/bin/guest_stub.rs"
# Measurement-only: same as `guest` but with ed25519 verification stubbed out,
# used to split the cycle count. Not the production guest.
required-features = ["zkvm-entrypoint"]

[[bin]]
name = "guest"
path = "src/bin/guest.rs"
# Cargo skips this target entirely unless the feature is on, so native
# `cargo test -p guest` works without the RISC Zero toolchain.
required-features = ["zkvm-entrypoint"]

# Standalone workspace root: `cargo risczero build` compiles this guest with
# `--manifest-path ... --locked`, which requires a lockfile next to this manifest.
# Without it the docker build resolves dependencies freely (it picked bincode 2
# against bincode-1 API code) and is not reproducible.
[workspace]

# The guest is its own workspace root, so the repository's `[profile.release]`
# does not reach it and it was building with cargo's defaults: `codegen-units =
# 16`, `lto = false`. Cycles are the entire cost model here, so build for
# speed: full LTO with one codegen unit lets the verifier's call chain inline
# across crate boundaries.
#
# `opt-level = 3`, not the repository's `"z"`: this binary is executed
# instruction-by-instruction, so what matters is instruction count, not size.
[profile.release]
codegen-units = 1
opt-level = 3
lto = true

# `ed25519-dalek`'s `curve25519-dalek` uses `crypto-bigint`'s `risc0` backend
# when built for the zkVM, which the crates.io `crypto-bigint` does not provide.
# RISC Zero's fork of `curve25519-dalek` expects this override — its own
# workspace root carries the same entry — so without it the guest compiles
# natively (the risc0 backend is cfg'd out) and only fails for the zkVM target.
[patch.crates-io]
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
