[package]
name = "verifier"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
groth16-core = { path = "../groth16-core" }
ark-bn254 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-serialize = "0.5"
hex = "0.4"
near-sdk = "5.29"

[dev-dependencies]
ark-groth16 = "0.5"
ark-relations = "0.5"
ark-std = "0.5"
# The guest crate, so `tests/host_ed25519_parity.rs` can compare its
# `ed25519_verify` against the NEAR host's on the same cases.
guest = { path = "../guest/methods/guest" }
# `Crypto` — the trait `Sha256Dalek` implements — lives here.
verify-core = { path = "../verify-core" }
ed25519-dalek = { git = "https://github.com/risc0/curve25519-dalek", tag = "curve25519-4.1.3-risczero.0" }
# Unifies near-sdk's test features so `cargo test -p verifier` works standalone:
# native tests then get real curve arithmetic (the mock delegates to nearcore VMLogic).
near-sdk = { version = "5.29", features = ["unit-testing", "non-contract-usage"] }
risc0-binfmt = "3.0.5"
risc0-groth16 = "3.0.5"
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }
risc0-zkp = "3.0.5"
serde_json = "1"

[features]
default = []
unit-testing = ["near-sdk/unit-testing", "near-sdk/non-contract-usage"]
